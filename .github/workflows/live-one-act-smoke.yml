name: Live PIS single-act smoke test

# One-time, explicitly requested test. A later manual run requires confirmation.
# No schedule, PR trigger or full-corpus selector.
on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Confirm: one live PIS act; review source terms and permission"
        type: boolean
        required: true
        default: false
  push:
    branches:
      - feature/ingest-smoke-actions
    paths:
      - '.github/workflows/live-one-act-smoke.yml'

permissions:
  contents: read

concurrency:
  group: live-pis-single-act
  cancel-in-progress: false

jobs:
  live-one-act:
    if: >-
      (github.event_name == 'push' &&
       github.event.head_commit.message == 'ci: one-shot live PIS smoke test')
      || (github.event_name == 'workflow_dispatch' && inputs.confirm_live == true)
    name: Current Constitution only (4 PIS GETs maximum)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12
          uv sync --locked --python 3.12 --extra dev

      - name: Fetch and parse one current act (no references or embeddings)
        run: uv run --no-sync python scripts/ci_live_one_act_smoke.py --report "$RUNNER_TEMP/live-one-act-report.json"

      - name: Show counts and citation metadata only
        run: cat "$RUNNER_TEMP/live-one-act-report.json"

      - name: Upload metadata-only report (never upload fetched statute text)
        uses: actions/upload-artifact@v4
        with:
          name: live-one-act-smoke
          path: ${{ runner.temp }}/live-one-act-report.json
          retention-days: 3
          if-no-files-found: error
